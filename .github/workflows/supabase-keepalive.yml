name: supabase-keepalive

# Supabase pauses Free plan projects that receive too little database activity over 7 days
# (https://supabase.com/docs/guides/platform/free-project-pausing). Its documented fix is to
# make API calls to the project, so this workflow runs a real database read through PostgREST
# every 3 days. Row-level security returns no rows to the publishable key; the query still
# runs in Postgres, which is what counts.
#
# Required repository variables (Settings > Secrets and variables > Actions > Variables; both
# are public, the same values as the Vercel NEXT_PUBLIC_GROUNDKIT_SUPABASE_* variables):
#   GROUNDKIT_SUPABASE_URL              e.g. https://<project-ref>.supabase.co
#   GROUNDKIT_SUPABASE_PUBLISHABLE_KEY
on:
  schedule:
    - cron: "41 2 */3 * *"  # every 3 days (days 1, 4, 7 ...), off the hour
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.GROUNDKIT_SUPABASE_URL }}
      SUPABASE_KEY: ${{ vars.GROUNDKIT_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Read from the database
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Set the GROUNDKIT_SUPABASE_URL and GROUNDKIT_SUPABASE_PUBLISHABLE_KEY repository variables."
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 4 --retry-all-errors --retry-delay 15 --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Database read failed (HTTP $status). The project may already be paused; resume it in the Supabase dashboard."
            cat response.json
            exit 1
          fi
