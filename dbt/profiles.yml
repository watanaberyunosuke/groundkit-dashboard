aviation:
  target: default
  outputs:
    default:
      type: duckdb
      # Absolute path to the DuckDB file, or md:<database> for MotherDuck.
      # `make transform` sets this for you; when calling dbt directly, export it first.
      path: "{{ env_var('WAREHOUSE', '../data/aviation.duckdb') }}"
      threads: 4
      # Every date_trunc / cast-to-date in the models is meant as UTC. Without this,
      # DuckDB uses the machine's timezone and day boundaries shift.
      settings:
        TimeZone: UTC
        # DuckDB runs an ASOF join as a nested loop when it estimates the left side at
        # fewer rows than this (default 64). The flights CTEs in fct_arrivals and
        # fct_departures (stg_flights joined to the airports seed) are estimated at
        # ~7 rows but hold ~160k, so their ASOF joins to stg_metar took 49 minutes
        # each on MotherDuck instead of under a second. 0 always uses the ASOF join.
        asof_loop_join_threshold: 0
